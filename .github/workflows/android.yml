name: SenzSpace CI (S0)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust core tests
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
      - run: cargo test --manifest-path rust/profile-core/Cargo.toml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # JANGAN pakai android-actions/setup-android@v3: step itu gagal di
      # run #1 karena menjalankan `sdkmanager tools` — paket `tools`
      # sudah tidak ada di cmdline-tools 16.0 ("Failed to find package
      # 'tools'", exit 1). Runner ubuntu sudah membawa Android SDK
      # preinstalled (/usr/local/lib/android/sdk); instal paket yang
      # dibutuhkan langsung dengan sdkmanager.
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: app
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: senzspace-s0-debug
          path: app/app/build/outputs/apk/debug/app-debug.apk
